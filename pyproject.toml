[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytqueue"
version = "0.1.0"
description = "A Discord-agnostic YouTube music player core: resolve, queue, autoplay, and stream audio via yt-dlp + ffmpeg."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.1.1",
]

[project.optional-dependencies]
discord = ["discord.py>=2.4.0"]
pot = ["bgutil-ytdlp-pot-provider>=2.0.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
